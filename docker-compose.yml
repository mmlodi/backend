services:
  database:
    image: postgres:16-alpine
    container_name: meus-boleto-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meusboleto}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
    container_name: meus-boleto-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-meusboleto}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-b33a3bee62cf2d0e7b5feb3122f80402aac5aeed5319e94da1f6a511fd881fc68fb8e52ac9e096051b491896d551e8c86409034259d047ceb6fee2cd4ed64251}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../meus-boleto
      args:
        VITE_JAVA_APP_API_BACKEND_URL: ${VITE_JAVA_APP_API_BACKEND_URL:-http://localhost:8080/api}
        VITE_EMAILJ_PUBLIC_KEY: ${VITE_EMAILJ_PUBLIC_KEY:-}
    container_name: meus-boleto-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
